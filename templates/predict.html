<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Prediction</title>
    <style>
        body {
            background-color: #ccffcc;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .container {
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 400px;
        }

        h2 {
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 10px;
            border: 1px solid #aaa;
            border-radius: 10px;
            resize: none;
            font-size: 16px;
            display: block;
            margin: 0 auto;
            text-align: left;
        }

        .btn {
            margin-top: 10px;
            padding: 10px 30px;
            border: none;
            background-color: #90ee90;
            color: black;
            font-size: 16px;
            border-radius: 20px 50px;
            cursor: pointer;
            transition: transform 0.2s ease-in-out;
        }

        .btn:hover {
            transform: scale(1.1);
        }

        .emoji {
            position: absolute;
            font-size: 50px;
            opacity: 0.3;
            animation: float 5s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>
    <div class="emoji" style="top: 10%; left: 20%">💰</div>
    <div class="emoji" style="top: 50%; left: 70%">💵</div>
    <div class="emoji" style="top: 80%; left: 40%">💸</div>
    <div class="emoji" style="top: 20%; left: 50%">💴</div>
    <div class="emoji" style="top: 60%; left: 10%">💶</div>
    <div class="emoji" style="top: 30%; left: 80%">💷</div>
    
    <div class="container">
        <h2>Enter Your Message</h2>
        <form action="/predict" method="POST">
            <textarea name="message" placeholder="Type your message..."></textarea>
            <br>
            <button type="submit" class="btn">Know Sentiment</button>
        </form>
        
    </div>
</body>
</html>
