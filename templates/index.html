<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Sentiment Analysis</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #b0f2b6, #a7e8b3); /* Light green gradient */
            color: #333;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        .money-symbol {
            position: absolute;
            font-size: 30px;
            animation: floatUp 5s linear infinite;
        }
        
        @keyframes floatUp {
            from { transform: translateY(100vh) scale(0.5); opacity: 1; }
            to { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
        
        .predict-btn {
            background: white;
            color: #333;
            border: 2px solid #4caf50;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease-in-out;
        }
        
        .predict-btn:hover {
            background-color: #4caf50;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(75, 175, 80, 0.3);
        }

        #result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            animation: fadeIn 1s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #loading {
            font-size: 20px;
            color: #555;
            margin-top: 10px;
        }

        .section {
            display: none;
        }

        .active {
            display: block;
        }

    </style>
</head>
<body>
    <!-- Main Page -->
    <div id="main-page" class="section active">
        <h2>Financial Sentiment Analysis</h2>
        <p>Predict Sentiment:</p>
        <!-- Updated button text -->
        <button class="predict-btn" onclick="window.location.href='/predict'">Predict Sentiment</button>
    </div>

    <!-- Prediction Page: This part will be available on /predict -->
    <div id="predict-page" class="section">
        <h2>Sentiment Prediction</h2>
        <p>Click the button below to predict sentiment:</p>
        <button class="predict-btn" onclick="predictSentiment()">Predict Sentiment</button>
        
        <p id="result"></p>
        <p id="loading" style="display: none;">Predicting...</p>
    </div>

    <script>
        function createMoneySymbols() {
            for (let i = 0; i < 20; i++) {
                let symbol = document.createElement("div");
                symbol.className = "money-symbol";
                let randomSymbol = Math.random() > 0.5 ? "💰" : "💵";  // Alternate between money and dollar symbols
                symbol.innerHTML = randomSymbol;
                symbol.style.left = Math.random() * 100 + "vw";
                symbol.style.animationDuration = (Math.random() * 3 + 2) + "s";
                document.body.appendChild(symbol);
                setTimeout(() => symbol.remove(), 5000);
            }
        }
        
        setInterval(createMoneySymbols, 1500);  // Create floating emojis

        function predictSentiment() {
            // Show "Predicting..." message
            document.getElementById("loading").style.display = "block";
            document.getElementById("result").innerHTML = ''; // Clear any previous result

            // Simulate a prediction delay (you can replace this with actual API call)
            setTimeout(() => {
                // Placeholder for sentiment prediction
                let sentiments = ["Positive", "Neutral", "Negative"];
                let randomIndex = Math.floor(Math.random() * sentiments.length);
                let sentiment = sentiments[randomIndex];
                
                let resultElement = document.getElementById("result");
                resultElement.innerHTML = `Predicted Sentiment: <span style="color: ${sentiment === 'Positive' ? '#4CAF50' : sentiment === 'Negative' ? '#FF3D00' : '#FFC107'}">${sentiment}</span>`;
                
                // Hide "Predicting..." message after prediction is shown
                document.getElementById("loading").style.display = "none";
            }, 2000); // Simulate 2-second delay
        }
    </script>
</body>
</html>
