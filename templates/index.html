<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Sentiment Analysis</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        
        .money-symbol {
            position: absolute;
            font-size: 24px;
            color: rgba(255, 215, 0, 0.7);
            animation: floatUp 5s linear infinite;
        }
        
        @keyframes floatUp {
            from { transform: translateY(100vh) scale(0.5); opacity: 1; }
            to { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
        
        .container {
            width: 50%;
            background: rgba(20, 20, 20, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: fadeIn 1.5s ease-in-out;
            position: relative;
            z-index: 10;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            background: #1e1e1e;
            color: #fff;
            outline: none;
            resize: none;
            transition: 0.3s;
        }
        
        textarea:focus {
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        .predict-btn {
            background: linear-gradient(90deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            transition: all 0.3s ease-in-out;
        }
        
        .predict-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 20px rgba(255, 75, 43, 0.5);
        }
        
        .dropdown {
            display: none;
            margin-top: 20px;
        }
        
        select {
            padding: 12px;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            background: #1e1e1e;
            color: white;
            outline: none;
            transition: 0.3s;
        }
        
        select:focus {
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }
        
        #result {
            margin-top: 20px;
            font-size: 22px;
            font-weight: bold;
            animation: fadeIn 1s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Financial Sentiment Analysis</h2>
        <p>Enter financial news or a stock market-related article:</p>
        <textarea id="textInput" placeholder="Type or paste financial text..."></textarea>
        <br>
        <button class="predict-btn" onclick="showDropdown()">Predict Sentiment</button>
        
        <div class="dropdown" id="sentimentDropdown">
            <label for="userPrediction">Select your sentiment prediction:</label>
            <select id="userPrediction">
                <option value="Positive">Positive</option>
                <option value="Neutral">Neutral</option>
                <option value="Negative">Negative</option>
            </select>
            <button class="predict-btn" onclick="analyzeSentiment()">Analyze</button>
        </div>
        
        <p id="result"></p>
    </div>
    
    <script>
        function showDropdown() {
            document.getElementById("sentimentDropdown").style.display = "block";
        }
        
        function analyzeSentiment() {
            let text = document.getElementById("textInput").value;
            let userPrediction = document.getElementById("userPrediction").value;
            let resultElement = document.getElementById("result");
            
            if (text.trim() === "") {
                resultElement.innerHTML = "Please enter some text!";
                resultElement.style.color = "red";
                return;
            }
            
            let sentiments = ["Positive", "Neutral", "Negative"];
            let randomIndex = Math.floor(Math.random() * sentiments.length);
            let sentiment = sentiments[randomIndex];
            
            resultElement.innerHTML = `Predicted Sentiment: <span style="color: ${sentiment === 'Positive' ? '#4CAF50' : sentiment === 'Negative' ? '#FF3D00' : '#FFC107'}">${sentiment}</span><br>Your Prediction: ${userPrediction}`;
        }
        
        function createMoneySymbols() {
            for (let i = 0; i < 20; i++) {
                let symbol = document.createElement("div");
                symbol.className = "money-symbol";
                symbol.innerHTML = "💰";
                symbol.style.left = Math.random() * 100 + "vw";
                symbol.style.animationDuration = (Math.random() * 3 + 2) + "s";
                document.body.appendChild(symbol);
                setTimeout(() => symbol.remove(), 5000);
            }
        }
        setInterval(createMoneySymbols, 1500);
    </script>
</body>
</html>
