<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Result</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #b0f2b6, #a7e8b3);
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 350px;
            z-index: 10;
        }
        h2 {
            font-size: 22px;
        }
        .result-text {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }
        .money-symbol {
            position: absolute;
            font-size: 30px;
            animation: floatUp 5s linear infinite;
        }
        @keyframes floatUp {
            from { transform: translateY(100vh) scale(0.5); opacity: 1; }
            to { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Sentiment Prediction Result</h2>
        <p class="result-text" id="sentiment"></p>
        <button onclick="window.location.href='/'" style="margin-top: 10px; padding: 10px 20px; border-radius: 10px; border: none; background: #4CAF50; color: white; font-size: 16px; cursor: pointer;">Back</button>
    </div>
    
    <script>
        function createMoneySymbols() {
            for (let i = 0; i < 15; i++) {
                let symbol = document.createElement("div");
                symbol.className = "money-symbol";
                symbol.innerHTML = Math.random() > 0.5 ? "💰" : "💵";
                symbol.style.left = Math.random() * 100 + "vw";
                symbol.style.animationDuration = (Math.random() * 3 + 2) + "s";
                document.body.appendChild(symbol);
                setTimeout(() => symbol.remove(), 5000);
            }
        }
        setInterval(createMoneySymbols, 1500);
        
        // Fetch sentiment result dynamically
        const params = new URLSearchParams(window.location.search);
        const sentiment = params.get("sentiment") || "Neutral";
        document.getElementById("sentiment").innerHTML = `Predicted Sentiment: <span style="color: ${sentiment === 'Positive' ? '#4CAF50' : sentiment === 'Negative' ? '#FF3D00' : '#FFC107'}">${sentiment}</span>`;
    </script>
</body>
</html>
